const THEME_KEY='liftlog_theme';function applyTheme(theme){document.documentElement.dataset.theme=theme;localStorage.setItem(THEME_KEY,theme);document.querySelectorAll('.theme-icon').forEach(e=>e.textContent=theme==='light'?'☾':'☼');document.querySelectorAll('.theme-label').forEach(e=>e.textContent=theme==='light'?'Dark mode':'Light mode');let m=document.getElementById('themeMeta');if(m)m.content=theme==='light'?'#f4f6fb':'#0a090a'}function toggleTheme(){applyTheme(document.documentElement.dataset.theme==='light'?'dark':'light')}applyTheme(localStorage.getItem(THEME_KEY)||'dark');
const PLAN=[{name:'Chest + Triceps',items:[['Incline Barbell Press',3,'6–8'],['Flat Dumbbell Press',3,'8–10'],['Weighted Dips',2,'8–10'],['Pec Deck',2,'12–15'],['Overhead Tricep Extension',3,'10–12'],['Rope Pushdowns',2,'12–15']]},{name:'Back + Biceps',items:[['Pull-Ups',3,'6–8'],['Neutral-Grip Lat Pulldown',2,'10–12'],['Chest-Supported Dumbbell Row',3,'8–10'],['Seated Cable Row',2,'10–12'],['Straight-Arm Pulldown',2,'12–15'],['Barbell Curl',3,'8–10'],['Incline Dumbbell Curl',2,'10–12']]},{name:'Legs + Abs',items:[['Barbell Squat',3,'6–8'],['Romanian Deadlift',3,'8–10'],['Leg Press',3,'10–12'],['Leg Curl',3,'10–15'],['Standing Calf Raises',4,'12–15'],['Hanging Leg Raises',3,'12–15'],['Plank',2,'45–60 sec']]},{name:'Chest + Shoulders',items:[['Incline Dumbbell Press',3,'8–10'],['Machine Chest Press',2,'10–12'],['Pec Deck',2,'12–15'],['Dumbbell Shoulder Press',2,'8–10'],['Dumbbell Lateral Raise',3,'12–15'],['Cable Lateral Raise',2,'15–20'],['Face Pulls',3,'12–15']]},{name:'Back + Arms + Legs',items:[['Chest-Supported Row',3,'8–10'],['Single-Arm Cable Row',2,'10–12'],['Bulgarian Split Squat',2,'10–12/leg'],['Leg Curl',2,'12–15'],['Rear Delt Fly',2,'12–15'],['Hammer Curl',3,'10–12'],['Preacher Curl',2,'10–12'],['Skull Crushers',3,'10–12'],['Rope Pushdowns',2,'12–15']]}];
const ORIGINAL_PLAN=structuredClone(PLAN);const KEY='liftlog_v1';const defaults={profile:{name:'',height:190,weight:82,age:22,goal:'recomp',sleep:7},sessions:[],drafts:{},day:0,body:[],notes:'',plan:structuredClone(ORIGINAL_PLAN)};let state;try{state={...structuredClone(defaults),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=structuredClone(defaults)};if(!Array.isArray(state.plan)||!state.plan.length)state.plan=structuredClone(ORIGINAL_PLAN);PLAN.splice(0,PLAN.length,...structuredClone(state.plan));state.day=Math.min(Math.max(0,state.day||0),PLAN.length-1);let tab='dashboard';let currentDate=new Date().toLocaleDateString('en-CA');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=(onlyDraft=false)=>{if(!cloudReady)return;syncCloud(onlyDraft)};const draftKey=()=>`${currentDate}|${state.day}`;const draft=()=>{let k=draftKey();if(!state.drafts[k])state.drafts[k]={sets:{},done:{},ranges:{},notes:''};return state.drafts[k]};const doneCount=d=>Object.values(d.done||{}).filter(Boolean).length;const totalExercises=()=>activeWorkoutPlan().items.length;const num=x=>Number(x)||0;const dateLabel=s=>new Date(s+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});function switchTab(t){tab=t;document.querySelectorAll('main>section').forEach(el=>el.classList.toggle('hidden',el.id!==t));document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
function render(){if(tab==='dashboard')home();if(tab==='workout')workout();if(tab==='progressPage')progress();if(tab==='profile')profile()}
function home() {
  const profile = state.profile;
  const day = PLAN[state.day];
  const last = state.sessions.at(-1);
  const volume = state.sessions.flatMap(session => Object.values(session.sets || {}).flat())
    .filter(set => num(set.weight) > 0 && num(set.reps) > 0)
    .reduce((total, set) => total + num(set.weight) * num(set.reps), 0);
  const suggestions = [
    ...(profile.sleep < 7 ? ['Aim for 7–9 hours of sleep to support recovery.'] : []),
    ...(profile.goal === 'recomp' ? ['Progressive overload, adequate protein, and consistent training support recomposition.'] : []),
    'Keep most working sets within 1–2 reps of failure.'
  ];
  const today = localDateKey();
  const monday = weekStart(today);
  const weeklyCount = state.sessions.filter(session => session.date >= monday && session.date <= today).length;
  const items = day.items.length;
  const sets = day.items.reduce((total, entry) => total + entry[1], 0);
  $('dashboard').innerHTML = `
    <div class="hero">
      <div class="hero-copy">
        <p class="eyebrow">${profile.name ? 'Welcome back, ' + esc(profile.name) : 'Your training'}</p>
        <h2>${esc(day.name)}</h2>
        <p class="hero-meta">${items} exercises <span aria-hidden="true">·</span> ${sets} working sets</p>
        <div class="hero-actions">
          <button class="btn" onclick="switchTab('workout')">Open workout</button>
          <button class="btn secondary" onclick="switchTab('progressPage')">View progress</button>
        </div>
      </div>
    </div>
    ${scheduleHTML()}
    <section class="training-overview" aria-labelledby="trainingOverviewTitle">
      <h2 id="trainingOverviewTitle">Training overview</h2>
      <div class="stat-grid">
        <details class="stat-card hard-card"><summary><span>Total sessions</span><strong>${state.sessions.length}</strong></summary><p>Saved workouts across your training history</p></details>
        <details class="stat-card hard-card"><summary><span>Body weight</span><strong>${num(profile.weight) || '—'}<sub>kg</sub></strong></summary><p>Latest weight from your profile</p></details>
        <details class="stat-card hard-card"><summary><span>Logged volume</span><strong>${Math.round(volume).toLocaleString()}<sub>kg</sub></strong></summary><p>Sum of logged weight × reps</p></details>
        <details class="stat-card hard-card"><summary><span>Sessions this week</span><strong>${weeklyCount}</strong></summary><p>Workouts saved since Monday</p></details>
      </div>
      ${last ? `<p class="last-session">Last session <strong>${dateLabel(last.date)}</strong> <span>${esc((last.planSnapshot || PLAN[last.day] || {name:'Workout'}).name)}</span></p>` : ''}
      <details class="card training-tips"><summary>Training tips</summary><ul>${suggestions.map(text => `<li>${esc(text)}</li>`).join('')}</ul></details>
    </section>`;
  bindScheduleDrag();
}
function weightConvention(name) {
  const n=String(name).toLowerCase();
  if (/plank|hanging leg raise|crunch|sit.?up|pull.?up|chin.?up|\bdips?\b|push.?up/.test(n)) return ['Added kg','Enter 0 for bodyweight. For assisted versions, note the assistance separately.'];
  if (/dumbbell|\bdb\b|hammer curl/.test(n)) return ['kg per dumbbell','Enter 20 for two 20 kg dumbbells, or 20 for one 20 kg dumbbell held with both hands.'];
  if (/leg press|hack squat|smith|plate.loaded/.test(n)) return ['Plates (kg)','Enter the total plates added. Note the machine and any sled or bar weight separately.'];
  if (/cable|pulldown|pushdown|face pull|pec deck|machine|leg curl|leg extension/.test(n)) return ['Stack (kg)','Enter the selected stack weight. For separate stacks, use the weight per side and note the setup.'];
  if (/barbell|\bbb\b|romanian deadlift|\brdl\b|deadlift|squat|skull.?crusher|bench press/.test(n) && !/bulgarian|split squat/.test(n)) return ['Total kg incl. bar','Enter the bar plus all plates. Check your bar’s actual weight.'];
  return ['Weight (kg)','Log the load consistently and note the equipment and how you measured it.'];

;padding:7px" value="${esc(goal)}" onchange="setRange(${i},this.value)"></div><div class="setrow sethead"><span>Set</span><span>${esc(weightLabel(name))}</span><span>${/sec/i.test(range)?'Seconds':'Reps'}</span><span>Last (kg × reps)</span><span></span></div>${rows.map((r,j)=>`<div class="setrow${r.completed===true?' set-completed':''}"><span class="muted">${j+1}</span>${setField(i,j,name, "weight",r.weight)}${setField(i,j,name,"reps",r.reps)}<span class="muted" style="text-align:center">${r.type==='warmup'?'—':previous(i,rows.slice(0,j).filter(set=>set.type!=='warmup').length)}</span><button class="btn secondary small" aria-label="Remove set" onclick="removeSet(${i},${j})">−</button><div class="set-action">${r.type==='warmup'?'<span class="muted">Warm-up</span>':'<span class="muted">Working</span>'}<button type="button" class="btn ${r.completed===true?'secondary':''}" id="completeSet-${i}-${j}" aria-label="${r.completed===true?'Undo':'Complete'} set ${j+1} for ${esc(name)}" onclick="toggleWorkoutSet(${i},${j})">${r.completed===true?'✓ Done · Undo':'Done'}</button></div></div>`).join('')}<button class="btn secondary small" style="margin-top:10px" onclick="addSet(${i})">+ Add working set</button> <button type="button" class="btn secondary small" style="margin-top:10px" onclick="addWarmupSet(${i})">+ Add warm-up</button> <button type="button" class="btn secondary small" style="margin-top:10px" onclick="appendWorkoutExercise(false)">+ Add exercise</button></div>`}).join('')}<button class="btn secondary" type="button" onclick="appendWorkoutExercise(false)">+ Add exercise</button><div class="field"><label for="workoutNotes">Session notes</label><textarea id="workoutNotes" rows="3" placeholder="Energy, technique, pain, PRs..." oninput="setNotes(this.value)">${esc(d.notes)}</textarea></div><div class="row wrap" style="margin-top:16px"><button class="btn" onclick="finishWorkout()">✓ Save completed workout</button><button class="btn secondary" onclick="clearDraft()">Clear draft</button></div></div>${workoutBar(day)}`}
function previous(i,j){let s=[...state.sessions].reverse().find(s=>s.day===state.day&&s.date<currentDate&&s.sets?.[i]?.[j]);let r=s?.sets[i][j];return r?(r.weight||'0')+'×'+(r.reps||'0'):'—'}function changeDate(v){if(!v)return;save();currentDate=v;render()}function changeDay(i){state.day=i;save();render()}function markDone(i,v){draft().done[i]=v;save();render()}function setRange(i,v){draft().ranges[i]=v;save();render()}function setValue(i,j,k,v){let d=draft();if(!d.sets[i])d.sets[i]=Array.from({length:activeWorkoutPlan().items[i][1]},()=>({weight:'',reps:''}));const row=d.sets[i][j];row[k]=v;if(row.completed!==true){delete row.prefilled;delete row.completed;}save(true)}function addSet(i){let d=draft();if(!d.sets[i])d.sets[i]=Array.from({length:activeWorkoutPlan().items[i][1]},()=>({weight:'',reps:''}));d.sets[i].push({weight:'',reps:''});save();render()}function removeSet(i,j){let d=draft();if(!d.sets[i])d.sets[i]=Array.from({length:activeWorkoutPlan().items[i][1]},()=>({weight:'',reps:''}));if(d.sets[i].length<=1)return;delete d.lastLogged;d.sets[i].splice(j,1);save();render()}function setNotes(v){draft().notes=v;save(true)}function clearDraft(){if(confirm('Clear all entered sets and checkmarks for this date and day?')){delete state.drafts[draftKey()];save();render()}}function finishWorkout(){let d=draft();let logged=Object.values(d.sets).some(rows=>rows.some(r=>r.reps!==''||r.weight!==''));if(!logged&&!doneCount(d)){alert('Enter at least one set or check off an exercise before saving.');return}let entry={...structuredClone(d),planSnapshot:structuredClone(activeWorkoutPlan()),date:currentDate,day:state.day,id:currentDate+'|'+state.day};state.sessions=state.sessions.filter(s=>s.id!==entry.id);state.sessions.push(entry);state.sessions.sort((a,b)=>a.date.localeCompare(b.date)||a.day-b.day);delete state.drafts[draftKey()];state.day=(state.day+1)%PLAN.length;save();alert('Workout saved. Next training day selected.');switchTab('progressPage')}

function viewSession(id){let s=state.sessions.find(s=>s.id===id);if(!s)return;let sessionPlan=s.planSnapshot||PLAN[s.day]||{name:'Deleted day',items:[]};let txt=sessionPlan.items.map(([n],i)=>{let rows=s.sets?.[i]||[];return n+': '+rows.map(r=>`${r.weight||0} kg × ${r.reps||0}`).join(', ')}).join('\n');alert(dateLabel(s.date)+' — '+sessionPlan.name+'\n\n'+txt+'\n\n'+(s.notes||''))}function showTrend(){let n=$('trendExercise').value;let arr=[];state.sessions.forEach(s=>{let i=(s.planSnapshot||PLAN[s.day]||{items:[]}).items.findIndex(x=>x[0]===n);if(i<0)return;let rows=s.sets?.[i]||[];let best=Math.max(0,...rows.filter(r=>num(r.reps)>0).map(r=>num(r.weight)));if(best>0)arr.push({date:s.date,best})});let e=$('trendResult');if(!arr.length){e.innerHTML='<p class="muted">No weighted sets logged for this exercise yet.</p>';return}let max=Math.max(...arr.map(x=>x.best));e.innerHTML=`<p>First: <b>${arr[0].best} kg</b> · Latest: <b>${arr.at(-1).best} kg</b> · Change: <b>${(arr.at(-1).best-arr[0].best).toFixed(1)} kg</b></p><div class="chart" style="margin-bottom:25px">${arr.slice(-10).map(x=>`<div class="bar" style="height:${Math.max(8,100*x.best/max)}%" title="${x.best} kg"><span>${dateLabel(x.date)}</span></div>`).join('')}</div><p class="notice">Best recorded external weight per session; this does not adjust for reps or exercise technique.</p>`}function addWeighIn(){let w=num($('weighIn').value);if(w<=0||w>500){alert('Enter a valid weight in kg.');return}state.profile.weight=w;state.body.push({date:new Date().toLocaleDateString('en-CA'),weight:w});save();render()}
function profile(){let p=state.profile;$('profile').innerHTML=`<h2>Your profile & settings</h2>${profileVisual(p)}<div class="card"><h3>Personal details</h3><div class="field"><label>Display name</label><input maxlength="60" placeholder="Your name" value="${esc(p.name||'')}" onchange="profileValue('name',this.value)"></div><p class="muted">Your display name is saved with your LiftLog profile.</p></div><div class="card"><p class="muted">Adjust these values to personalize the BMI calculation and recovery suggestions.</p><div class="grid"><div class="field"><label>Height (cm)</label><input type="number" inputmode="decimal" min="1" value="${esc(p.height)}" onchange="profileValue('height',this.value)"></div><div class="field"><label>Weight (kg)</label><input type="number" inputmode="decimal" min="1" value="${esc(p.weight)}" onchange="profileValue('weight',this.value)"></div><div class="field"><label>Age</label><input type="number" inputmode="numeric" min="1" value="${esc(p.age)}" onchange="profileValue('age',this.value)"></div><div class="field"><label>Average sleep (hours)</label><input type="number" inputmode="decimal" min="0" max="24" step="0.5" value="${esc(p.sleep)}" onchange="profileValue('sleep',this.value)"></div></div><div class="field" style="margin-top:12px"><label>Primary goal</label><select onchange="profileValue('goal',this.value)"><option value="recomp" ${p.goal==='recomp'?'selected':''}>Body recomposition</option><option value="gain" ${p.goal==='gain'?'selected':''}>Muscle gain</option><option value="cut" ${p.goal==='cut'?'selected':''}>Fat loss</option></select></div><div class="hint">At ${num(p.weight)} kg, a practical protein target for resistance training is about <b>${Math.round(num(p.weight)*1.6)}–${Math.round(num(p.weight)*2.2)} g/day</b> (1.6–2.2 g/kg).</div></div><div class="card"><div class="row"><h3>Workout plan editor</h3><button class="btn small" onclick="openPlanEditor()">Edit routine</button></div><p>Rename training days, add or remove exercises, change sets and rep targets, and reorder exercises. Changes sync to your account.</p><div id="planEditor" class="hidden"></div></div><div class="card"><div class="row wrap"><div><div class="eyebrow">QUICK SETUP</div><h3>Import a workout plan</h3></div><span class="muted">TXT / Paste</span></div><p>Paste your workout split or choose a .txt file. Preview the parsed days, exercises, sets and reps before replacing your current plan.</p><div class="field"><label for="planImportText">Your workout routine</label><textarea id="planImportText" rows="8" style="width:100%;resize:vertical" placeholder="DAY 1 — CHEST + TRICEPS&#10;• Incline Barbell Press — 4×6–8&#10;• Flat Dumbbell Press — 3×8–10&#10;&#10;DAY 2 — BACK + BICEPS&#10;• Pull-Ups — 4×6–8"></textarea></div><div class="row wrap" style="margin-top:12px"><label class="btn secondary" style="cursor:pointer">Choose TXT file<input type="file" accept=".txt,text/plain" style="display:none" onchange="readWorkoutTxt(this.files[0]);this.value=''" /></label><button class="btn" onclick="previewWorkoutImport()">Preview import</button></div><div id="planImportPreview" aria-live="polite" style="margin-top:12px"></div></div><div class="card"><h3>Data & privacy</h3><p>Workout data is saved on this device and syncs to your account when connected. Conflicting device changes pause sync for review. Keep backups and check the sync status before signing out.</p><div class="row wrap"><button class="btn secondary" onclick="exportData()">Export JSON backup</button><label class="btn secondary" style="cursor:pointer">Import backup<input type="file" accept="application/json,.json" style="display:none" onchange="importData(this.files[0])"></label><button class="btn danger" onclick="resetAll()">Delete all data</button></div></div><div class="card"><h3>Training reminders</h3><p>Use 2–3 minutes rest for heavy compound lifts and 60–120 seconds for isolation movements. Increase weight when all sets reach the top of the rep range with clean form. R let pendingWorkoutImport=null;
async function readWorkoutTxt(file){if(!file)return;if(file.size>200000)return alert('TXT file must be smaller than 200 KB.');try{const t=await file.text();document.getElementById('planImportText').value=t;previewWorkoutImport()}catch(e){alert('Unable to read TXT file: '+e.message)}}
function parseWorkoutPlan(text){
 const days=[];let current=null,skipped=[];
 const clean=t=>t.replace(/\*\*/g,'').replace(/\r/g,'').trim();
 const lines=text.split(/\n/);
 for(let idx=0;idx<lines.length;idx++){
  let line=clean(lines[idx]);if(!line||/^[-=_]{3,}$/.test(line))continue;
  let heading=line.match(/^(?:#{1,4}\s*)?(?:day\s*(\d+)|(?:monday|tuesday|wednesday|thursday|friday|saturday|sunday))\s*[:.)\-–—|]*\s*(.*)$/i);
  if(!heading && /^#{1,4}\s+/.test(line)){heading=[line,null,line.replace(/^#{1,4}\s+/,'')];}
  if(heading){let name=(heading[2]||'Workout').replace(/\s*\([^)]*\)\s*$/,'').trim();current={name:name||'Workout',items:[]};days.push(current);continue;}
  if(/^(?:rest\s*day|rest|notes?|warm.?up|cool.?down)\s*:?$/i.test(line))continue;
  line=line.replace(/^(?:[-*•●▪◦]|\d+[.)])\s*/,'').trim();
  let match=line.match(/^(.+?)\s*(?:\s+[—–-]\s+|\s*[:|]\s*|\s+)(\d{1,2})\s*(?:sets?\s*(?:of|x|×|\*)?\s*|[x×*]\s*)(\d{1,3})(?:\s*[-–—]\s*(\d{1,3}))?\s*(?:reps?)?\s*$/i);
  if(!match)match=line.match(/^(.+?)\s*\(\s*(\d{1,2})\s*[x×*]\s*(\d{1,3})(?:\s*[-–—]\s*(\d{1,3}))?\s*\)\s*$/i);
  if(!match){skipped.push('Line '+(idx+1)+': '+line.slice(0,90));continue;}
  let name=match[1].trim().replace(/\s+[—–-]\s*$/,'');let sets=Number(match[2]),lo=Number(match[3]),hi=match[4]?Number(match[4]):null;
  if(!name||sets<1||sets>20||lo<1||lo>100||hi!==null&&(hi<lo||hi>100)){skipped.push('Line '+(idx+1)+': '+line.slice(0,90));continue;}
  if(!current){current={name:'Workout 1',items:[]};days.push(current)}
  current.items.push([name,sets,hi===null?String(lo):lo+'–'+hi]);
 }
 const valid=days.filter(d=>d.items.length);
 if(valid.length>14)throw Error('Maximum 14 workout days per import.');
 if(valid.reduce((a,d)=>a+d.items.length,0)>150)throw Error('Maximum 150 exercises per import.');
 if(!valid.length)throw Error('No exercises recognized. Use e.g. DAY 1 — CHEST and • Bench Press — 3×8–12.');
 return {days:valid,skipped};
}
function previewWorkoutImport(){const el=document.getElementById('planImportPreview');pendingWorkoutImport=null;try{

 el.innerHTML=`<div class="notice"><b>Ready to import:</b> ${result.days.length} days · ${count} exercises</div>${result.days.map((d,i)=>`<div class="exercise"><b>Day ${i+1} — ${esc(d.name)}</b><div class="muted">${d.items.map(x=>`${esc(x[0])} · ${x[1]} × ${esc(x[2])}`).join('<br>')}</div></div>`).join('')}${result.skipped.length?`<p class="notice"><b>${result.skipped.length} lines not recognized:</b><br>${result.skipped.slice(0,8).map(esc).join('<br>')}${result.skipped.length>8?'…':''}</p>`:''}<button class="btn" onclick="applyWorkoutImport()">Replace workout plan & sync</button><p class="muted">Existing saved sessions stay in your history. Unsaved workout drafts will be cleared.</p>`;
 }catch(e){el.innerHTML=`<p class="notice" role="alert">${esc(e.message)}</p>`}}
function applyWorkoutImport(){if(!pendingWorkoutImport?.length)return;const next=structuredClone(pendingWorkoutImport);if(!confirm(`Replace your current ${PLAN.length}-day plan with ${next.length} imported days? Saved workout history will remain.`))return;PLAN.splice(0,PLAN.length,...next);state.drafts={};state.day=0;state.plan=structuredClone(PLAN);save();pendingWorkoutImport=null;render();alert('Workout plan imported. Wait for “Synced to cloud” before closing the page.');}

let editingPlan=false;
function persistPlan(){state.plan=structuredClone(PLAN);state.day=Math.min(state.day,PLAN.length-1);save();renderPlanEditor();}
function openPlanEditor(){editingPlan=!editingPlan;renderPlanEditor();}
function renderPlanEditor(){let el=$('planEditor');if(!el)return;el.classList.toggle('hidden',!editingPlan);if(!editingPlan)return;el.innerHTML=`<p class="notice">Saved workouts retain their exercise names when logged with this version. Changes to the plan affect new sessions.</p>${PLAN.map((day,di)=>`<div class="exercise"><div class="row wrap"><b>Day ${di+1}: ${esc(day.name)}</b><span><button class="btn secondary small" onclick="renameDay(${di})">Rename</button> <button class="btn danger small" onclick="deleteDay(${di})">Delete</button></span></div>${day.items.map(([name,sets,reps],ei)=>`<div class="row wrap" style="padding:8px 0;border-bottom:1px solid #293449"><div style="flex:1;min-width:160px"><b>${esc(name)}</b><div class="muted">${sets} sets · ${esc(reps)} reps</div></div><div><button class="btn secondary small" onclick="moveExercise(${di},${ei},-1)" aria-label="Move up">↑</button> <button class="btn secondary small" onclick="moveExercise(${di},${ei},1)" aria-label="Move down">↓</button> <button class="btn secondary small" onclick="editExercise(${di},${ei})">Edit</button> <button class="btn danger small" onclick="deleteExercise(${di},${ei})">×</button></div></div>`).join('')}<button class="btn secondary small" style="margin-top:10px" onclick="addExercise(${di})">+ Add exercise</button></div>`).join('')}<button class="btn secondary" onclick="addDay()">+ Add training day</button>`;}
function renameDay(di){let name=prompt('Training day name',PLAN[di].name);if(name===null)return;name=name.trim();if(!name)return alert('Enter a name.');PLAN[di].name=name;persistPlan();}

function editExercise(di,ei){let old=PLAN[di].items[ei];let name=prompt('Exercise name',old[0]);if(name===null||!name.trim())return;let sets=prompt('Default number of sets (1–20)',old[1]);if(sets===null)return;sets=Number(sets);if(!Number.isInteger(sets)||sets<1||sets>20)return alert('Sets must be 1–20.');let reps=prompt('Target reps (e.g. 8–12)',old[2]);if(reps===null||!reps.trim())return;PLAN[di].items[ei]=[name.trim(),sets,reps.trim()];state.drafts={};persistPlan();}
function addExercise(di){let name=prompt('New exercise name');if(!name?.trim())return;let sets=Number(prompt('Number of sets (1–20)','3'));if(!Number.isInteger(sets)||sets<1||sets>20)return alert('Sets must be 1–20.');let reps=prompt('Target reps','8–12');if(!reps?.trim())return;PLAN[di].items.push([name.trim(),sets,reps.trim()]);persistPlan();}
function deleteExercise(di,ei){if(!confirm('Remove this exercise from your plan?'))return;PLAN[di].items.splice(ei,1);state.drafts={};persistPlan();}
function moveExercise(di,ei,delta){let arr=PLAN[di].items,other=ei+delta;if(other<0||other>=arr.length)return;[arr[ei],arr[other]]=[arr[other],arr[ei]];state.drafts={};persistPlan();}

let cloudClient=null,cloudUser=null,cloudReady=false,syncTimer=null,syncSequence=0;
const badge=() => document.getElementById('syncBadge');
function syncCloud(){
  const seq=++syncSequence;
  badge().textContent='Unsaved changes…';
  clearTimeout(syncTimer);
  syncTimer=setTimeout(async()=>{
    if(!cloudReady||!cloudUser||seq!==syncSequence)return;
    const payload=structuredClone(state),userId=cloudUser.id;
    try{
      const {error}=await cloudClient.from('user_data').upsert({user_id:userId,payload,updated_at:new Date().toISOString()},{onConflict:'user_id'});
      if(error)throw error;
      if(seq===syncSequence)badge().textContent='✓ Synced to cloud';
    }catch(e){badge().textContent='⚠ Sync failed — retry after connection';console.error('LiftLog sync:',e);}
  },750);
}
let sdkLoad;
function getSDK(){
  if(window.supabase)return Promise.resolve();
  if(!sdkLoad)sdkLoad=new Promise((resolve,reject)=>{
    const script=document.createElement('script');
    script.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
    script.onload=resolve;script.onerror=()=>{sdkLoad=null;reject(Error('Connection unavailable'))};
    document.head.append(script);
  });
  return sdkLoad;
}
async function initCloud(){
  const deviceOwner=localStorage.getItem('liftlog_device_owner');
  if(!navigator.onLine && deviceOwner){
    offlineIdentity=true;await loadCloud({id:deviceOwner});return;
  }
  const url=window.LIFTLOG_SUPABASE_URL,key=window.LIFTLOG_SUPABASE_ANON_KEY;
  if(!url||!key||url.includes('YOUR-PROJECT')||key.includes('YOUR-')){
    document.getElementById('authConfigMessage').textContent='Setup needed: create config.js from config.example.js and enter your Supabase project URL and publishable key.';return;
  }
  try{await getSDK()}catch{}
  if(!window.supabase){document.getElementById('authConfigMessage').textContent='Supabase library could not load. Check your connection.';return;}
  cloudClient ||= window.supabase.createClient(url,key);
  const {data:{session},error}=await cloudClient.auth.getSession();
  if(error){$('authMessage').textContent='Could not check your session. Reconnect and retry.';return;}
  offlineIdentity=false;
  if(session?.user)await loadCloud(session.user);
  else {cloudReady=false;cloudUser=null;$('authGate').classList.remove('hidden');}
  cloudClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){localStorage.removeItem('liftlog_device_owner');syncOwner=null;cloudReady=false;cloudUser=null;document.getElementById('authGate').classList.remove('hidden');document.getElementById('signOutBtn').style.display='none';badge().textContent='Signed out';}});
}
async function authAction(action){
  if(!cloudClient){$('authMessage').textContent='Connecting…';await initCloud();if(!cloudClient){$('authMessage').textContent='Connect to the internet to sign in, then try again.';return;}}
  const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;
  const msg=document.getElementById('authMessage');msg.textContent='Working…';
  try{
    if(!email||password.length<6)throw Error('Enter an email and a password of at least 6 characters.');
    const {data,error}=action==='signup'?await cloudClient.auth.signUp({email,password}):await cloudClient.auth.signInWithPassword({email,password});
    if(error)throw error;
    if(data.session?.user)await loadCloud(data.session.user);
    else msg.textContent='Check your email to confirm your account, then sign in.';
  }catch(e){msg.textContent=e.message;}
}
async function loadCloud(user){
  badge().textContent='Loading cloud data…';
  const {data,error}=await cloudClient.from('user_data').select('payload').eq('user_id',user.id).maybeSingle();
  if(error){document.getElementById('authMessage').textContent='Could not load cloud data: '+error.message;return;}
  cloudUser=user;
  if(data?.payload&&Object.keys(data.payload).length){state={...structuredClone(defaults),...data.payload};}
  else{
    // Explicitly ask before importing legacy browser data into a new cloud account.
    let old=null;try{old=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}
    const hasOld=old&&(old.sessions?.length||old.body?.length||Object.keys(old.drafts||{}).length);
    state=hasOld&&confirm('Import existing LiftLog workouts from this browser into your cloud account?')?{...structuredClone(defaults),...old}:structuredClone(defaults);
  }
  if(!Array.isArray(state.plan)||!state.plan.length)state.plan=structuredClone(ORIGINAL_PLAN);PLAN.splice(0,PLAN.length,...structuredClone(state.plan));state.day=Math.min(Math.max(0,state.day||0),PLAN.length-1);cloudReady=true;document.getElementById('authGate').classList.add('hidden');document.getElementById('signOutBtn').style.display='inline-flex';render();
  if(!data)syncCloud();else badge().textContent='✓ Synced to cloud';
}
async function signOut(){
  if(!cloudClient)return;
  if(badge().textContent.includes('Unsaved')){alert('Wait for sync to finish before signing out.');return;}
  await cloudClient.auth.signOut();state=structuredClone(defaults);render();
}

const insightToday=()=>new Date().toLocaleDateString('en-CA');

const round=n=>Math.round(n*10)/10;
function insightLine(values,label){if(!values.length)return '<p class="muted">No data recorded yet.</p>';let w=640,h=160,min=Math.min(...values),max=Math.max(...values);if(max===min){min=Math.max(0,min-1);max+=1}let points=values.map((v,i)=>`${22+i*(w-44)/Math.max(1,values.length-1)},${h-22-(v-min)/(max-min)*(h-44)}`).join(' ');return `<svg role="img" aria-label="${esc(label)} chart" viewBox="0 0 ${w} ${h}" class="insight-chart"><line x1="22" x2="618" y1="138" y2="138" stroke="currentColor" opacity=".18"/><polyline points="${points}" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>${values.map((v,i)=>`<circle cx="${22+i*(w-44)/Math.max(1,values.length-1)}" cy="${h-22-(v-min)/(max-min)*(h-44)}" r="4" fill="var(--accent)"><title>${round(v)}</title></circle>`).join('')}</svg><div class="muted">First: ${round(values[0])} · Latest: ${round(values.at(-1))} · ${values.length} observations</div>`}
let timerEnd=0,timerTick=null;
function timerKey(){return 'liftlog_rest_until_'+(cloudUser?.id||'guest')}
function timerStart(seconds){
  timerEnd=Date.now()+seconds*1000;
  localStorage.setItem(timerKey(),String(timerEnd));
  resumeTimer();
}
function timerPaint(){
  const left=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));
  const label=$('restTime');
  if(label)label.textContent=timerEnd&&!left?'Rest complete':String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
  if(!left){
    clearInterval(timerTick);
    if(timerEnd && localStorage.getItem('liftlog_rest_vibrate')==='yes')navigator.vibrate?.(180);
    timerEnd=0;localStorage.removeItem(timerKey());
  }
}
function resumeTimer(){
  clearInterval(timerTick);
  timerEnd=Number(localStorage.getItem(timerKey()))||0;
  timerPaint();
  if(timerEnd&&!document.hidden)timerTick=setInterval(timerPaint,500);
}
function timerStop(){timerEnd=0;localStorage.removeItem(timerKey());timerPaint()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearInterval(timerTick);else if(cloudReady)resumeTimer()});
const oldWorkout=workout;
workout=function(){oldWorkout();let el=$('workout');el.insertAdjacentHTML('afterbegin',`<div class="card"><div class="row wrap"><div><div class="eyebrow">IN-SESSION TOOLS</div><h3>Rest timer <span id="restTime" class="timer-digit">00:00</span></h3></div><div class="row wrap"><button class="btn secondary small" onclick="timerStart(60)">1 min</button><button class="btn secondary small" onclick="timerStart(90)">90 sec</button><button class="btn secondary small" onclick="timerStart(120)">2 min</button><button class="btn secondary small" onclick="timerStart(180)">3 min</button><button class="btn secondary small" onclick="timerStop()">Stop</button><label><input type="checkbox" ${localStorage.getItem('liftlog_rest_vibrate')==='yes'?'checked':''} onchange="localStorage.setItem('liftlog_rest_vibrate',this.checked?'yes':'no')"> Vibrate</label></div></div></div>`);resumeTimer()};
// Previous sets are matched by exercise name, not mutable day/index positions.
previous=function(i,j){let name=PLAN[state.day]?.items[i]?.[0];let s=[...state.sessions].reverse().find(s=>s.date<currentDate&&(s.planSnapshot||PLAN[s.day])?.items?.some(x=>x[0]===name));if(!s)return '—';let idx=(s.planSnapshot||PLAN[s.day]).items.findIndex(x=>x[0]===name);let r=s.sets?.[idx]?.[j];return r?`${r.weight||0}×${r.reps||0}`:'—'};
function insightNav(){if($('insightNav'))return;let nav=document.querySelector('.tabs');if(!nav)return;let b=document.createElement('button');b.id='insightNav';b.dataset.tab='insights';b.innerHTML='<span class="nav-icon" aria-hidden="true">◈</span><span class="nav-label">Insights</span>';b.onclick=()=>switchTab('insights');nav.append(b);let sec=document.createElement('section');sec.id='insights';sec.className='hidden';document.querySelector('main').append(sec)}
const baseRender=render;render=function(){baseRender();if(tab==='insights')renderInsights()};
const viewLoads=new Map();
function loadView(view,path){
  const root=$(view);
  root.innerHTML='<div class="card skeleton" role="status">Loading '+(view==='insights'?'insights':'progress')+'…</div>';
  if(viewLoads.has(view))return;
  const script=document.createElement('script');script.src=path;viewLoads.set(view,script);
  script.onload=()=>{if(tab===view)render()};
  script.onerror=()=>{
    viewLoads.delete(view);script.remove();
    if(tab===view)root.innerHTML='<div class="card" role="alert">This view could not load. <button class="btn" onclick="render()">Retry</button></div>';
  };
  document.head.append(script);
}
function renderInsights(){loadView('insights','/insights.js')}
insightNav();
